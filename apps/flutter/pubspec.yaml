name: pocox
description: "POCOX Flutter front-end. Drives codex app-server through flutter_rust_bridge."
publish_to: 'none'

version: 0.6.0+36

# Flutter SDK is locked at the project level via FVM (`.fvmrc`) and at
# the language level via `environment.flutter`. CI uses
# `subosito/flutter-action@v2` with the same version pin. Whenever
# you bump Flutter, update all three sites in lockstep.
environment:
  sdk: ^3.12.0
  flutter: "3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # gen-l10n localization (ARB-driven). intl's version is pinned by the
  # Flutter SDK; leave it unconstrained so `pub get` resolves the match.
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  # flutter_rust_bridge is wired up by `flutter_rust_bridge_codegen
  # integrate`. The version constraint here is what `pub get` checks
  # against; the codegen tool picks a matching binary.
  flutter_rust_bridge: 2.12.0
  pocox_bridge:
    path: rust_builder
  flutter_riverpod: ^2.6.1
  flutter_webrtc: 1.6.2+hotfix.3
  go_router: ^14.6.2
  path_provider: ^2.1.5
  # Native buffers for the galaxy's per-frame call into the Rust bridge.
  ffi: ^2.2.0
  # Renders agent replies as Markdown documents (headings, code, lists,
  # tables) instead of plain chat bubbles. Maintained drop-in for the
  # discontinued flutter_markdown (same `MarkdownBody` API). 1.0.9 stops a
  # custom link builder from repeating the tail of a label split in two.
  flutter_markdown_plus: ^1.0.9
  # The CommonMark parser behind flutter_markdown_plus. Declared directly
  # because lib/src/markdown_cjk.dart registers a custom InlineSyntax with it
  # (CommonMark's emphasis rules can't bold CJK text next to full-width
  # punctuation). Must stay compatible with flutter_markdown_plus's own pin.
  markdown: ^7.3.1
  # Opens URLs in the system browser (tapped links in agent replies / tool
  # output / plain text). url_launcher_windows is bundled and auto-registered.
  url_launcher: ^6.3.1
  # Browser-redirect GitHub login (the convenient mode): opens an in-app browser
  # tab (ASWebAuthenticationSession on iOS, Custom Tabs on Android) or a system
  # browser + loopback listener (desktop), and captures the backend's redirect
  # back to the app. The backend brokers GitHub's authorization-code flow; the
  # app only ever holds a one-time exchange code (+ a PKCE verifier). Mobile
  # needs the CallbackActivity intent-filter (AndroidManifest) / CFBundleURLSchemes
  # (Info.plist) for the `pocox` scheme; desktop uses http://localhost.
  flutter_web_auth_2: ^4.1.0
  # Linkifies bare URLs in plain-text widgets (user bubbles, tool/command
  # output, reasoning) — markdown links are handled by MarkdownBody itself.
  flutter_linkify: ^6.0.0
  # Variable-height-aware lazy list. The conversation mixes very short message
  # bubbles with tall command/code/output/grouped-activity cards; a plain
  # ListView.builder estimates total scroll extent from a running average of
  # laid-out children, so the scrollbar thumb jumps as differently sized rows
  # enter/leave the viewport during a drag (and as agent text streams in).
  # SuperListView estimates per-item extents and reconciles them against the
  # real height as rows scroll through the cache area, giving a stable thumb
  # while keeping lazy virtualization. Pure-Dart, MIT, all platforms. Pinned —
  # the package is in low-maintenance mode (no release since 2024); pin guards
  # against a future-Flutter break and avoids relying on the (buggy on desktop)
  # animateToItem/ListController path — we keep the existing ScrollController.
  super_sliver_list: 0.4.1
  # Desktop system tray (Windows/macOS/Linux). tray_manager draws the tray icon
  # + context menu; window_manager intercepts the window-close (so closing
  # hides to tray instead of quitting) and shows/focuses the window from the
  # tray. Both are no-ops on mobile — main.dart gates init on desktop. Linux
  # builds additionally need libayatana-appindicator3-dev (see release.yml).
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  file_selector: ^1.1.0
  # Native mobile Save As dialogs; 0.5+ needs a newer SDK-pinned meta package.
  file_saver: ^0.4.0
  share_plus: ^13.2.1
  path: ^1.9.1
  # Message image attachments: pick from the photo library on Android/iOS
  # (PHPicker / system Photo Picker — no runtime permission needed) and a
  # file dialog on desktop (delegates to file_selector). Camera is not used,
  # so no camera permission strings are required.
  image_picker: ^1.2.0
  desktop_drop: ^0.7.1
  pasteboard: ^0.5.0
  # Renders an .svg the agent produced in the file preview (pure Dart, the
  # Flutter team's package). Pinned exactly: a renderer bump can change
  # what a preview looks like.
  flutter_svg: 2.3.0
  # The app's one icon family (Lucide, ISC): a consistent stroke set mapped
  # in lib/src/app_icons.dart. Pinned exactly so a glyph redraw is a choice.
  lucide_icons_flutter: 3.1.25
  # Opens a page another device shared in an in-app browser on phones: the
  # app stays in the foreground, which keeps the relay tunnel to it alive.
  # The Flutter team's package; desktops use the system browser instead.
  webview_flutter: ^4.14.1

dev_dependencies:
  # Pre-migration comparator for the opt-in rendering benchmark only.
  re_highlight: ^0.0.3
  image: ^4.9.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # Widget tests swap ImagePickerPlatform.instance / FileSelectorPlatform.instance
  # / WebViewPlatform.instance for fakes (the real ones are platform channels
  # or views that can't run headless). All are already in the dependency
  # graph; declared so tests may import them.
  image_picker_platform_interface: ^2.11.0
  file_selector_platform_interface: ^2.6.0
  webview_flutter_platform_interface: ^2.15.1
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3
  fake_async: 1.3.3

flutter:
  uses-material-design: true
  generate: true
  # The galaxy's backdrop (rendered once per size and theme).
  shaders:
    - shaders/nebula.frag
  # Only the theme-matched brand marks ship in the bundle. logo.png stays in
  # the repo as marketing material — bundling it would add dead weight.
  #
  # The tray icons (tray_template.png for the macOS menu bar, tray.png for
  # Linux, tray.ico for Windows) are tiny and only loaded on desktop;
  # tray_manager resolves them relative to data/flutter_assets, so they must
  # ship as bundled assets. Drawn by test/gen_icon_test.dart.
  assets:
    - assets/logo/mark_light.png
    - assets/logo/mark_dark.png
    - assets/logo/glyph_light.png
    - assets/logo/glyph_dark.png
    - assets/tray/tray_template.png
    - assets/tray/tray.png
    - assets/tray/tray.ico
  # The design system's typefaces (SIL OFL, see assets/fonts/OFL-*.txt): Google
  # Sans Flex for prose (static instances cut from the variable master at
  # opsz 16 / wdth 100), Geist Mono for code. Static instances rather than the variable
  # TTFs — Flutter maps FontWeight to the nearest *declared* weight and would
  # not interpolate a weight axis. ~850 KB total, so unlike Noto Sans SC these
  # ship on every platform; neither face has any CJK glyph, so Chinese falls
  # through to the fallback chain in lib/src/fonts.dart.
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Light.ttf
          weight: 300
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlex-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  # All launcher icons are the blue brand tile drawn by test/gen_icon_test.dart
  # (one vector source for every platform); it generates:
  #   icon_glyph.png        rounded tile + ~10% margin (desktop / web)
  #   icon_mobile.png       full-bleed opaque tile (iOS + Android legacy)
  #   icon_adaptive_bg.png  the tile gradient (Android adaptive background)
  #   icon_adaptive_fg.png  glyph inside the safe zone (adaptive fg)
  image_path: "icon/icon_glyph.png"
  # iOS: full-bleed opaque tile; remove_alpha is a harmless safety net.
  ios: true
  image_path_ios: "icon/icon_mobile.png"
  remove_alpha_ios: true
  # Android: legacy square mipmaps from image_path_android (old launchers show
  # the tile as-is) PLUS an adaptive icon (API 26+) whose foreground keeps the
  # tile inside the safe zone so a circle/squircle mask never clips it.
  android: true
  image_path_android: "icon/icon_mobile.png"
  min_sdk_android: 21
  adaptive_icon_background: "icon/icon_adaptive_bg.png"
  adaptive_icon_foreground: "icon/icon_adaptive_fg.png"
  adaptive_icon_foreground_inset: 0
  # Web: PWA icons + manifest colours (replaces the stock Flutter favicon).
  web:
    generate: true
    image_path: "icon/icon_glyph.png"
    background_color: "#FFFFFF"
    theme_color: "#2A52C4"
  # Windows: NOT generated here. This tool writes a single-frame .ico (one size,
  # whatever `icon_size` says), and Windows then downscales that one raster for
  # the taskbar at 32 px and the title bar at 16 px — a detailed mark reduced 8:1
  # in one step looks visibly blurry, which macOS never showed because its
  # .appiconset ships every size as its own file.
  #
  # `test/gen_icon_test.dart` writes runner/resources/app_icon.ico instead, with
  # each of the 8 sizes Windows asks for rendered at that size. Re-run it with
  # REGEN_ICONS=1 after changing the brand masters.
  windows:
    generate: false
  # macOS: the Dock shows the icon as-is (no mask); the rounded tile carries
  # the standard ~10% margin baked into icon_glyph.png.
  macos:
    generate: true
    image_path: "icon/icon_glyph.png"

# Theme-matched splash: each mark is its theme's bare glyph, sized to sit in
# Android 12's circle crop, on the theme surface (MarkStyle.light / .dark in
# gen_icon_test.dart). Keep these colours equal to those tiles.
flutter_native_splash:
  image: assets/logo/mark_light.png
  image_dark: assets/logo/mark_dark.png
  color: "#FBFBFA"
  color_dark: "#19191B"
  android_12:
    image: assets/logo/mark_light.png
    image_dark: assets/logo/mark_dark.png
    color: "#FBFBFA"
    color_dark: "#19191B"
