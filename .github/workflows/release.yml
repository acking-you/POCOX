# Release pipeline — builds and publishes every platform's package on a version
# tag. Push a tag like `v1.2.3` (or run manually — a manual run produces a DRAFT
# release so nothing goes public by accident, unless macos_release_tag explicitly
# selects an existing release whose macOS assets should be refreshed).
#
# Two product families, named so they never collide:
#   - CLI  → `pocket-codex-cli-<tag>-<rust-target>.{tar.gz,zip}`
#            Linux builds are musl + fully static (glibc-independent: run on
#            Alpine, old distros, ARM SBCs) via `cross`.
#   - App  → `pocket-codex-app-<tag>-<platform>.<ext>` with one-click installers
#            (Windows .exe, macOS .dmg, Linux .AppImage + .deb) plus the
#            portable archives, and Android .apk / iOS unsigned .ipa.
#
# Release notes are generated ONCE in the `prepare` job and every other job
# attaches that same body (`body_path:`), so the body is never duplicated.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      macos_release_tag:
        description: "Update only the signed macOS assets of an existing release (for example v0.2.10)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  # Keep in sync with apps/flutter/.fvmrc, pubspec `environment.flutter`, and ci.yml.
  FLUTTER_VERSION: "3.44.0"
  # Match rust-toolchain.toml so cargo/cross build with the pinned toolchain.
  RUST_TOOLCHAIN: nightly-2026-06-01
  RELEASE_NAME: Pocket-Codex ${{ github.ref_name }}
  IS_DRAFT: ${{ github.event_name == 'workflow_dispatch' }}
  # The backend server the CLI + app default to, baked at build time from the
  # repo-configurable variable (`gh variable set POCKET_CODEX_BACKEND_HOST`).
  # Read via option_env! in both account.rs; empty/unset falls back to the
  # bundled default. cross forwards it into the musl container via Cross.toml.
  POCKET_CODEX_BACKEND_HOST: ${{ vars.POCKET_CODEX_BACKEND_HOST }}

jobs:
  # --- Release notes, generated exactly once ---------------------------------
  prepare:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate existing macOS release target
        if: inputs.macos_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.macos_release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          app_version="$(sed -n 's/^version: //p' apps/flutter/pubspec.yaml)"
          test "${app_version%%+*}" = "${RELEASE_TAG#v}"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.draft == false and .prerelease == false and .immutable != true')" = true
      - name: Build release notes
        if: inputs.macos_release_tag == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # GitHub's autogenerated changelog — only when a real tag exists
          # (a manual run on a branch has none; the draft just omits it).
          changelog=""
          if [ "${{ github.event_name }}" = "push" ]; then
            changelog="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${tag}" --jq '.body' 2>/dev/null || true)"
          fi
          {
            echo "## Pocket-Codex ${tag}"
            echo
            echo "Remote-control your codex sessions from any device. This release ships the desktop/mobile **app** and the **CLI**."
            echo
            echo "### Which file do I want?"
            echo
            echo "**App (GUI)** — \`pocket-codex-app-*\`:"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Windows | \`…-windows-x64-setup.exe\` (installer) · \`…-windows-x64.zip\` (portable) |"
            echo "| macOS | \`…-macos-arm64.dmg\` (Apple Silicon) · \`…-macos-x64.dmg\` (Intel) — also \`.zip\` |"
            echo "| Linux | \`…-linux-x86_64.AppImage\` (portable) · \`…-linux-amd64.deb\` (Debian/Ubuntu) · \`…-linux-x64.zip\` |"
            echo "| Android | \`…-android-arm64-v8a.apk\` (most phones) · armeabi-v7a · x86_64 |"
            echo "| iOS | \`…-ios-unsigned.ipa\` (sideload / development) |"
            echo
            echo "**CLI** — \`pocket-codex-cli-*\`: statically linked **musl** Linux binaries (x86_64 / aarch64 / armv7 — run on any distro, no glibc dependency), plus macOS (x64 / arm64) and Windows x64."
            echo
            echo "> Android APKs use a persistent release signature from v0.2.4 onward. Older debug-signed builds cannot be upgraded in place; save your settings before uninstalling an old build. iOS remains unsigned for sideloading/development."
            if [ -n "${changelog}" ]; then
              echo
              echo "${changelog}"
            fi
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md
      - uses: actions/upload-artifact@v4
        if: inputs.macos_release_tag == ''
        with:
          name: release-notes
          path: release_notes.md

  # --- CLI (`pocket-codex`) — static musl Linux + native macOS/Windows --------
  cli:
    if: inputs.macos_release_tag == ''
    name: CLI (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static, glibc-independent Linux builds via cross.
          - { target: x86_64-unknown-linux-musl,      os: ubuntu-latest,  cross: true }
          - { target: aarch64-unknown-linux-musl,     os: ubuntu-latest,  cross: true }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest,  cross: true }
          # Native desktop targets.
          - { target: x86_64-apple-darwin,            os: macos-latest,   cross: false }
          - { target: aarch64-apple-darwin,           os: macos-latest,   cross: false }
          - { target: x86_64-pc-windows-msvc,         os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build pocket-codex CLI
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the verified Windows linker settings.
          if [ "${{ runner.os }}" = "Windows" ]; then
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
            export CARGO_PROFILE_RELEASE_LTO=false
          fi
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p pocket-codex-cli --bin pocket-codex --target ${{ matrix.target }}
          else
            cargo build --release --locked -p pocket-codex-cli --bin pocket-codex --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          name="pocket-codex-cli-${tag}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pocket-codex.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/pocket-codex" "dist/$name/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          rm -rf "dist/$name"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ env.IS_DRAFT }}
          body_path: release_notes.md
          files: dist/*

  # --- App: Windows (Inno Setup installer + portable zip) ---------------------
  app-windows:
    if: inputs.macos_release_tag == ''
    name: App (Windows)
    needs: prepare
    runs-on: windows-latest
    # Preserve the verified Windows linker settings for Cargokit.
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-windows
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      # Desktop bundles Noto Sans SC (fixes thin/uneven Chinese on Windows).
      - name: Activate desktop manifest (bundle Noto Sans SC)
        shell: bash
        working-directory: apps/flutter
        run: cp pubspec-desktop.yaml pubspec.yaml
      - name: Build Windows app
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package (installer + portable zip)
        shell: pwsh
        working-directory: apps/flutter
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${env:GITHUB_REF_NAME}" -replace "/","-"
          $ver = $tag -replace "^v",""
          $rel = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          # Portable zip
          Compress-Archive -Path "$rel/*" -DestinationPath "dist/pocket-codex-app-$tag-windows-x64.zip" -Force
          # One-click installer via Inno Setup
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$ver" "/DBuildDir=$((Resolve-Path $rel).Path)" "/DOutDir=$((Resolve-Path dist).Path)" "windows\packaging\pocket-codex.iss"
          Rename-Item "dist/pocket-codex-app-setup.exe" "pocket-codex-app-$tag-windows-x64-setup.exe"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ env.IS_DRAFT }}
          body_path: release_notes.md
          files: apps/flutter/dist/*

  # --- App: Linux (AppImage + .deb + portable zip) ----------------------------
  app-linux:
    if: inputs.macos_release_tag == ''
    name: App (Linux)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-linux
      - name: Install Linux desktop + packaging deps
        run: |
          sudo apt-get update -y
          # libayatana-appindicator3-dev: required by tray_manager's Linux build
          # (the plugin CMake errors out without an appindicator implementation).
          # libwebkit2gtk-4.1-dev: required by desktop_webview_window, which
          # flutter_web_auth_2 pulls in transitively for the web login. We use the
          # loopback-server path (useWebview:false), so webkit is never invoked at
          # runtime, but the plugin still compiles + links against it on Linux.
          # imagemagick: scales the 1024² icon master down to the size the
          # hicolor directory it is installed into actually claims. Present on
          # GitHub's ubuntu images, but declared so packaging does not depend on
          # what the runner image happens to preinstall.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libwebkit2gtk-4.1-dev \
            file desktop-file-utils fakeroot zip imagemagick
      - name: Activate desktop manifest (bundle Noto Sans SC)
        shell: bash
        working-directory: apps/flutter
        run: cp pubspec-desktop.yaml pubspec.yaml
      - name: Build Linux app
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package (zip + AppImage + deb)
        shell: bash
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          # dpkg requires the Version field to start with a digit. A real tag
          # yields e.g. 0.0.1; a manual/branch run has a non-numeric ref, so
          # fall back to 0.0.0 there.
          debver="$(printf '%s' "${tag}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          [ -n "${debver}" ] || debver="0.0.0"
          bundle="build/linux/x64/release/bundle"
          mkdir -p dist

          # The desktop-entry icon, resolved ONCE for both the AppImage and the
          # .deb so the two cannot drift apart. `icon_glyph.png` is the desktop
          # launcher master (rounded tile + margin) that gen_icon_test.dart
          # produces; this used to name `icon_square.png`, which the rebrand in
          # 95d919b deleted without touching this workflow — so Linux packaging
          # broke silently and shipped no artifacts for v0.1.9.
          #
          # Fail loudly rather than let `cp` do it 40 lines later, and check the
          # name still exists so the next rename is caught here.
          icon_master=icon/icon_glyph.png
          [ -f "${icon_master}" ] || {
            echo "::error::${icon_master} is missing — did the icon set get renamed?"
            ls -1 icon/
            exit 1
          }
          # Scaled to the size the hicolor directory it lands in claims. The
          # master is 1024²; shipping that under 256x256/ (as this did) leaves
          # every desktop rescaling it at runtime.
          icon_png="$(mktemp -d)/pocket-codex.png"
          convert "${icon_master}" -resize 256x256 "${icon_png}"

          # Bundle the FULL non-GTK Ayatana/dbusmenu runtime closure that the
          # Linux tray plugin links against, so the portable zip AND AppImage run
          # on hosts lacking the Ayatana packages. Derived from ldd (the whole
          # transitive closure: libayatana-appindicator3 -> -indicator3 -> -ido3,
          # plus libdbusmenu-{glib,gtk3}) instead of a partial hard-coded list;
          # GTK/glib stay host-provided. They land in the flutter bundle's own
          # lib/ (already on the runner's rpath), so every artifact built from
          # $bundle below is self-contained. The .deb additionally Depends on the
          # runtime package as the apt-native mechanism.
          mkdir -p "$bundle/lib"
          appindicator="$(find /usr/lib /lib -name 'libayatana-appindicator3.so.1' 2>/dev/null | head -n1)"
          if [ -n "${appindicator}" ]; then
            ayatana_libs="$({ echo "${appindicator}"; ldd "${appindicator}" | awk '/=> \//{print $3}'; } \
              | grep -E 'libayatana-(appindicator3|indicator3|ido3)|libdbusmenu-(glib|gtk3)' \
              | sort -u || true)"
            for so in ${ayatana_libs}; do cp -Lf "${so}" "$bundle/lib/"; done
          fi

          # 1) Portable zip
          ( cd "$bundle" && zip -qry "${OLDPWD}/dist/pocket-codex-app-${tag}-linux-x64.zip" . )

          # 2) AppImage
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps"
          # $bundle/lib already carries the Ayatana closure (bundled above), so
          # copying the whole bundle makes the AppImage self-contained too.
          cp -r "$bundle"/* "$appdir/usr/bin/"
          cp "${icon_png}" "$appdir/usr/share/icons/hicolor/256x256/apps/pocket-codex.png"
          cp "${icon_png}" "$appdir/pocket-codex.png"
          cat > "$appdir/usr/share/applications/pocket-codex.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=PocketCodex
          Comment=Remote-control codex sessions from any device
          Exec=pocket_codex
          Icon=pocket-codex
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          DESKTOP
          cp "$appdir/usr/share/applications/pocket-codex.desktop" "$appdir/"
          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/pocket_codex" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            "$appdir" "dist/pocket-codex-app-${tag}-linux-x86_64.AppImage"

          # 3) Debian package
          deb=pocket-codex-deb
          rm -rf "$deb"
          mkdir -p "$deb/DEBIAN" "$deb/usr/bin" "$deb/usr/lib/pocket-codex" \
                   "$deb/usr/share/applications" "$deb/usr/share/icons/hicolor/256x256/apps"
          cp -r "$bundle"/* "$deb/usr/lib/pocket-codex/"
          ln -s /usr/lib/pocket-codex/pocket_codex "$deb/usr/bin/pocket-codex"
          cp "${icon_png}" "$deb/usr/share/icons/hicolor/256x256/apps/pocket-codex.png"
          cat > "$deb/usr/share/applications/pocket-codex.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=PocketCodex
          Comment=Remote-control codex sessions from any device
          Exec=/usr/lib/pocket-codex/pocket_codex
          Icon=pocket-codex
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          DESKTOP
          cat > "$deb/DEBIAN/control" <<CONTROL
          Package: pocket-codex
          Version: ${debver}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Pocket-Codex Contributors <noreply@github.com>
          Depends: libgtk-3-0, libayatana-appindicator3-1, libwebkit2gtk-4.1-0
          Description: Pocket-Codex desktop app
           Remote-control your codex sessions from any device.
          CONTROL
          dpkg-deb --build --root-owner-group "$deb" \
            "dist/pocket-codex-app-${tag}-linux-amd64.deb"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ env.IS_DRAFT }}
          body_path: release_notes.md
          files: apps/flutter/dist/*

  # --- App: macOS (per-arch DMG + portable zip) -------------------------------
  # `flutter build macos` defaults to a UNIVERSAL binary (arm64 + x86_64), which
  # makes the Rust bridge — statically linking the whole codex tree — compile
  # TWICE on one machine. Under the release profile (after #49 flipped it to
  # `panic = "unwind"`) that double build outgrew the ~7 GB arm64 runner and
  # wedged for 40-85 min, so v0.1.2/v0.1.3 shipped without a macOS desktop app.
  # Instead build ONE arch per job, constrained to a single slice, and ship two
  # downloads (Apple Silicon + Intel): half the work per job, no double-compile
  # memory thrash. Both legs run on macos-latest (Apple Silicon) — GitHub no
  # longer serves Intel `macos-13` runners (jobs targeting it queue forever), so
  # x64 is CROSS-built on the arm64 runner, exactly like the CLI job already
  # cross-builds x86_64-apple-darwin. FLUTTER_XCODE_ARCHS pins each leg's slice.
  app-macos:
    name: App (macOS ${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both on macos-latest (Apple Silicon): arm64 native, x64 cross-built.
          - { arch: arm64, runner: macos-latest, xarch: arm64, rust: aarch64-apple-darwin }
          - { arch: x64, runner: macos-latest, xarch: x86_64, rust: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Require signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: python3 scripts/package_macos.py --check-credentials
      - uses: actions/download-artifact@v4
        if: inputs.macos_release_tag == ''
        with:
          name: release-notes
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          # Install this leg's Rust target: x64 is cross-built on the arm64
          # runner so it needs x86_64-apple-darwin; for arm64 it's the host
          # target (a harmless no-op). Use the real triple (aarch64-, not arm64-).
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-macos-${{ matrix.arch }}
      - name: Activate desktop manifest (bundle Noto Sans SC)
        shell: bash
        working-directory: apps/flutter
        run: cp pubspec-desktop.yaml pubspec.yaml
      - name: Build macOS app (${{ matrix.arch }})
        working-directory: apps/flutter
        # Constrain Xcode — and the Rust bridge build phase, which reads $ARCHS —
        # to THIS job's single arch via FLUTTER_XCODE_ARCHS (Flutter forwards
        # FLUTTER_XCODE_* as xcodebuild build settings). ONLY_ACTIVE_ARCH=NO lets
        # the x64 leg cross-build its (non-active) x86_64 slice on the arm64
        # runner. So the codex tree compiles once, not twice. codegen-units=16 +
        # LTO off stay as a belt-and-braces memory cap on the 7 GB runner;
        # negligible size cost, and `panic = "unwind"` runtime is preserved.
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.xarch }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          flutter pub get
          flutter build macos --release
      - name: Sign, notarize and verify macOS packages
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          ARCH: ${{ matrix.arch }}
          XARCH: ${{ matrix.xarch }}
          RELEASE_TAG: ${{ inputs.macos_release_tag || github.ref_name }}
        run: |
          tag="${RELEASE_TAG//\//-}"
          python3 scripts/package_macos.py \
            --app apps/flutter/build/macos/Build/Products/Release/pocket_codex.app \
            --architecture "$XARCH" \
            --output "apps/flutter/dist/pocket-codex-app-${tag}-macos-${ARCH}.dmg"
      - name: Preserve notarization results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verification-${{ matrix.arch }}
          path: apps/flutter/dist/*-verification/
          if-no-files-found: ignore
      - uses: softprops/action-gh-release@v2
        if: inputs.macos_release_tag == ''
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ env.IS_DRAFT }}
          body_path: release_notes.md
          files: |
            apps/flutter/dist/*.dmg
            apps/flutter/dist/*.zip

      - name: Replace verified macOS assets in the existing release
        if: inputs.macos_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.macos_release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            apps/flutter/dist/*.dmg apps/flutter/dist/*.zip

  macos-refresh-notes:
    name: Record macOS release refresh
    if: inputs.macos_release_tag != ''
    needs: app-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.macos_release_tag }}
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: process.env.RELEASE_TAG,
            });
            const start = '<!-- macos-signed-refresh -->';
            const end = '<!-- /macos-signed-refresh -->';
            const note = [start, '### macOS package update', '',
              'The Apple Silicon and Intel DMG/ZIP packages include fixed blue Dock/menu-bar icons, collapsed-by-default child sessions with working fold controls, the theme-toggle fix, Developer ID signatures, and stapled Apple notarization tickets.',
              `Rebuilt from commit ${context.sha}. Other platform assets are unchanged.`,
              end].join('\n');
            const body = (release.body || '').replace(
              /\n?<!-- macos-signed-refresh -->[\s\S]*?<!-- \/macos-signed-refresh -->/g, '').trimEnd();
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, body: `${body}\n\n${note}\n`,
            });

  # --- App: Android (split per ABI) -------------------------------------------
  app-android:
    if: inputs.macos_release_tag == ''
    name: App (Android)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-android
      - name: Restore Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Android release signing key is missing"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocket-codex-release.jks"
      - name: Build Android APKs (split per ABI)
        env:
          PCX_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pocket-codex-release.jks
          PCX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        working-directory: apps/flutter
        run: |
          flutter pub get
          test -n "$PCX_ANDROID_KEYSTORE_PASSWORD" || { echo "Android signing password is missing"; exit 1; }
          flutter build apk --release --split-per-abi
      - name: Package
        shell: bash
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          src="build/app/outputs/flutter-apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            python3 ../../scripts/verify_android_apk.py --abi "$abi" "$src/app-$abi-release.apk"
          done
          cp "$src/app-arm64-v8a-release.apk"   "dist/pocket-codex-app-${tag}-android-arm64-v8a.apk"
          cp "$src/app-armeabi-v7a-release.apk" "dist/pocket-codex-app-${tag}-android-armeabi-v7a.apk"
          cp "$src/app-x86_64-release.apk"      "dist/pocket-codex-app-${tag}-android-x86_64.apk"
          (cd dist && sha256sum ./*.apk > "pocket-codex-${tag}-android-SHA256SUMS.txt")
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ env.IS_DRAFT }}
          body_path: release_notes.md
          files: apps/flutter/dist/*

  # --- App: iOS (unsigned, for sideloading / dev) -----------------------------
  app-ios:
    if: inputs.macos_release_tag == ''
    name: App (iOS, unsigned)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-ios
      - name: Build iOS app (no codesign)
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        shell: bash
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          ( cd build/ios/iphoneos && mkdir -p Payload && mv Runner.app Payload/ \
            && zip -qry "${OLDPWD}/dist/pocket-codex-app-${tag}-ios-unsigned.ipa" Payload )
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ env.IS_DRAFT }}
          body_path: release_notes.md
          files: apps/flutter/dist/*
