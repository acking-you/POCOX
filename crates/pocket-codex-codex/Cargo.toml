[package]
name = "pocket-codex-codex"
description = "Process management and protocol bridge for the upstream codex app-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
pocket-codex-core = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
json5 = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }
sysinfo = { workspace = true }
nix = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["user"] }
tempfile = "3"

# Non-reaping child exit checks (`child_exited_unreaped`) on every Unix.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
rustix = { version = "1", features = ["process"] }
