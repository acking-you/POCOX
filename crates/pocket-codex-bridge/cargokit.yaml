# Cargokit (flutter_rust_bridge build glue) options for this crate, read
# by `apps/flutter/rust_builder/cargokit` when Flutter builds the bridge.
#
# Keep debug archives compact while retaining file:line backtraces.
# Only protocol types and the POCOX bridge are linked, never a Codex runtime.
cargo:
  debug:
    extra_flags:
      - "--config"
      - profile.dev.debug="line-tables-only"
