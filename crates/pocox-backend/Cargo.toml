[package]
name = "pocox-backend"
description = "Hosted POCOX backend: GitHub-login HTTP API + the broker that bridges authenticated clients to a loopback pb-mapper relay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
name = "pocox_backend"
path = "src/lib.rs"

[[bin]]
name = "pocox-backend"
path = "src/main.rs"

[dependencies]
pocox-account-proto = { workspace = true }
pocox-core = { workspace = true }
pocox-store = { workspace = true }
pocox-auth = { workspace = true }
pocox-pb = { workspace = true }

tokio = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
tower-http = { workspace = true }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
figment = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
